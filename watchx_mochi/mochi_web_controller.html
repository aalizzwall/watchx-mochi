<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>watchX Mochi-Robot 控制台 & LM Studio 聯動</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1117; color: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px 15px; }
    .card { background: #1a1e29; border: 1px solid #2a3042; border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #60a5fa; text-align: center; margin-bottom: 8px; }
    p.sub { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .status-badge { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; padding: 8px 16px; border-radius: 20px; background: #262c3d; margin-bottom: 20px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .dot.connected { background: #10b981; box-shadow: 0 0 10px #10b981; }
    button { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-connect { background: #3b82f6; color: white; margin-bottom: 20px; }
    .btn-connect:hover { background: #2563eb; }
    .btn-disconnect { background: #475569; color: white; margin-bottom: 20px; }
    .btn-disconnect:hover { background: #334155; }
    .section-title { font-size: 15px; font-weight: 600; color: #93c5fd; margin: 16px 0 12px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .btn-mood { background: #272d3e; color: #e2e8f0; border: 1px solid #3b4256; }
    .btn-mood:hover { background: #333a50; border-color: #60a5fa; }
    .btn-mood:active { transform: scale(0.98); }
    .lm-box { background: #131722; border: 1px solid #283046; border-radius: 10px; padding: 14px; margin-top: 10px; }
    .input-row { display: flex; gap: 8px; margin-top: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #f8fafc; font-size: 14px; }
    .btn-send { width: auto; padding: 10px 18px; background: #10b981; color: white; }
    .btn-send:hover { background: #059669; }
    .log-box { background: #090c14; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #94a3b8; height: 110px; overflow-y: auto; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DASAI MOCHI ROBOT</h1>
    <p class="sub">watchX 藍牙控制 & LM Studio 地端大模型聯動</p>

    <div class="status-badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">未連線藍牙</span>
    </div>

    <button id="btnConnect" class="btn-connect" onclick="toggleConnect()">掃描並連線 Mochi-Robot</button>

    <div class="section-title">手動表情測試</div>
    <div class="btn-grid">
      <button class="btn-mood" onclick="sendChar('B')">✍️ 振筆疾書 (LM 運算)</button>
      <button class="btn-mood" onclick="sendChar('D')">🎉 慶祝微笑 (^ ^)</button>
      <button class="btn-mood" onclick="sendChar('I')">👀 一般呆萌 (正常)</button>
      <button class="btn-mood" onclick="sendChar('S')">💤 進入睡眠 (Zzz)</button>
    </div>

    <div class="section-title">LM Studio 測試提問 (觸發表情)</div>
    <div class="lm-box">
      <div style="font-size:13px; color:#cbd5e1;">發送 Prompt 到 LM Studio (localhost:1234)，Mochi 將自動進入振筆疾書並於回答完成時開心微笑！</div>
      <div class="input-row">
        <input type="text" id="promptInput" value="用一句話介紹 Dasai Mochi 機器人" placeholder="輸入要問 LM Studio 的問題...">
        <button class="btn-send" onclick="sendToLMStudio()">發送</button>
      </div>
    </div>

    <div class="log-box" id="logBox">系統準備就緒... 請點擊上方按鈕連線。<br></div>
  </div>

  <script>
    // Adafruit Nordic UART Service UUIDs
    const NORDIC_UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NORDIC_UART_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // Phone -> watchX (Write)
    const NORDIC_UART_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // watchX -> Phone (Notify)

    let bleDevice = null;
    let rxCharacteristic = null;

    function log(msg) {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      box.innerHTML += `[${time}] ${msg}<br>`;
      box.scrollTop = box.scrollHeight;
    }

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        log("正在開啟瀏覽器藍牙掃描視窗...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: false,
          filters: [
            { namePrefix: 'Mochi' },
            { namePrefix: 'watchX' },
            { namePrefix: 'Adafruit' },
            { services: [NORDIC_UART_SERVICE] }
          ],
          optionalServices: [NORDIC_UART_SERVICE]
        });

        log(`已選取裝置: ${bleDevice.name}，正在連線 GATT 伺服器...`);
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        log("GATT 連線成功，正在取得 Nordic UART 服務...");
        const service = await server.getPrimaryService(NORDIC_UART_SERVICE);
        rxCharacteristic = await service.getCharacteristic(NORDIC_UART_RX);

        document.getElementById('statusDot').className = 'dot connected';
        document.getElementById('statusText').innerText = `已連線: ${bleDevice.name}`;
        document.getElementById('btnConnect').className = 'btn-disconnect';
        document.getElementById('btnConnect').innerText = '中斷連線';
        log("🎉 藍牙 UART 通道建立完畢！可以開始控制 Mochi！");
      } catch (err) {
        log(`連線失敗或取消: ${err.message}`);
      }
    }

    function onDisconnected() {
      document.getElementById('statusDot').className = 'dot';
      document.getElementById('statusText').innerText = '未連線藍牙';
      document.getElementById('btnConnect').className = 'btn-connect';
      document.getElementById('btnConnect').innerText = '掃描並連線 Mochi-Robot';
      rxCharacteristic = null;
      log("藍牙已中斷連線。");
    }

    async function sendChar(c) {
      if (!rxCharacteristic) {
        log("請先連線藍牙！");
        alert("請先點擊上方按鈕連線 Mochi-Robot！");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(c));
        log(`已傳送指令: '${c}'`);
      } catch (err) {
        log(`傳送失敗: ${err.message}`);
      }
    }

    async function sendToLMStudio() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return;

      log("🚀 發送請求給 LM Studio (localhost:1234)...");
      // 1. 命令 Mochi 進入振筆疾書！
      await sendChar('B');

      try {
        const res = await fetch('http://localhost:1234/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.7,
            max_tokens: 150
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const reply = data.choices[0].message.content;
        log(`LM Studio 回應: "${reply.slice(0, 45)}..."`);

        // 2. 完成後慶祝笑臉 + 叮一聲！
        await sendChar('D');

        // 3. 4秒後回到普通呆萌待機
        setTimeout(() => {
          sendChar('I');
        }, 4000);
      } catch (err) {
        log(`LM Studio 請求失敗: ${err.message} (請確認 LM Studio 的 Local Server 是否已啟動)`);
        await sendChar('I');
      }
    }
  </script>
</body>
</html>
